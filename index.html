<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 多人日程 · 时间段 · 动态成员</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    :root { --bg: #f4f6fb; --surface: #ffffff; --text: #1f2937; --text-muted: #6b7280; --border: #e5e7eb; --primary: #4f46e5; --primary-soft: #eef2ff; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --radius-lg: 20px; --radius-md: 14px; --radius-sm: 8px; --shadow-sm: 0 2px 8px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.03); --shadow-md: 0 8px 24px rgba(0,0,0,0.05); }
    body { background: var(--bg); color: var(--text); line-height: 1.5; padding: 24px 16px 48px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
    .app-container { max-width: 1400px; width: 100%; }
    .header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon { background: var(--primary); color: white; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 16px; font-size: 1.6rem; box-shadow: 0 8px 16px -4px rgba(79,70,229,0.25); }
    .logo-text h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; }
    .logo-text p { font-size: 0.9rem; color: var(--text-muted); }
    .user-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .user-switcher { display: flex; align-items: center; gap: 12px; background: var(--surface); padding: 8px 12px 8px 20px; border-radius: 100px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .user-switcher label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; display: flex; align-items: center; gap: 6px; }
    .user-switcher select { padding: 8px 32px 8px 16px; border: 1.5px solid var(--border); border-radius: 100px; font-size: 0.95rem; font-weight: 600; background: var(--bg); color: var(--text); cursor: pointer; outline: none; appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%236b7280" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>'); background-repeat: no-repeat; background-position: right 14px center; background-size: 16px; }
    .user-switcher select:focus { border-color: var(--primary); background-color: var(--surface); }
    .btn-add-member { background: var(--surface); border: 1.5px dashed var(--border); padding: 8px 18px; border-radius: 100px; font-weight: 600; font-size: 0.9rem; color: var(--primary); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .btn-add-member:hover { background: var(--primary-soft); border-color: var(--primary); }
    .stats-badge { background: var(--surface); padding: 10px 20px; border-radius: 100px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; align-items: center; gap: 16px; font-weight: 500; flex-wrap: wrap; }
    .stats-badge i { color: var(--primary); margin-right: 6px; }
    .stats-badge span { color: var(--primary); font-weight: 700; font-size: 1.2rem; margin-left: 4px; }
    .add-card { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-md); margin-bottom: 24px; border: 1px solid var(--border); transition: transform 0.2s ease; }
    .add-card:hover { transform: translateY(-2px); }
    .add-form { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    .form-group { flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .form-group label i { font-size: 0.8rem; color: var(--primary); }
    .form-group input, .form-group select { padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; background: var(--bg); transition: 0.2s; outline: none; width: 100%; font-weight: 400; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px rgba(79,70,229,0.1); }
    .time-range-group { display: flex; gap: 8px; flex: 2 1 240px; }
    .time-range-group .form-group { flex: 1; min-width: 100px; }
    .btn-add { background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 16px -4px rgba(79,70,229,0.3); white-space: nowrap; height: 44px; flex: 0 0 auto; }
    .btn-add:hover { background: #4338ca; transform: scale(1.02); }
    .btn-add i { font-size: 0.95rem; }
    .filter-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 16px; }
    .filter-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn { background: var(--surface); border: 1px solid var(--border); padding: 8px 18px; border-radius: 100px; font-weight: 500; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px -2px rgba(79,70,229,0.3); }
    .filter-btn.active i { color: white; }
    .btn-clear { background: transparent; border: 1px solid var(--border); padding: 8px 16px; border-radius: 100px; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .btn-clear:hover { background: #fee2e2; border-color: var(--danger); color: var(--danger); }
    .member-filter { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 4px 8px 4px 16px; font-size: 0.9rem; }
    .member-filter i { color: var(--text-muted); }
    .member-filter select { border: none; background: transparent; font-weight: 500; font-size: 0.9rem; padding: 6px 28px 6px 6px; outline: none; cursor: pointer; appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%236b7280" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>'); background-repeat: no-repeat; background-position: right 6px center; background-size: 14px; }
    .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 18px; margin-top: 8px; }
    .task-card { background: var(--surface); border-radius: var(--radius-md); padding: 18px 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); border-left: 6px solid var(--primary); transition: all 0.2s ease; display: flex; flex-direction: column; gap: 12px; animation: fadeIn 0.25s ease; }
    .task-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .task-card[data-category="工作"] { border-left-color: #4f46e5; }
    .task-card[data-category="学习"] { border-left-color: #0ea5e9; }
    .task-card[data-category="生活"] { border-left-color: #10b981; }
    .task-card[data-category="重要"] { border-left-color: #ef4444; }
    .task-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .task-title { font-weight: 600; font-size: 1.05rem; line-height: 1.4; word-break: break-word; display: flex; align-items: center; gap: 10px; flex: 1; }
    .task-title i { font-size: 0.9rem; color: var(--text-muted); margin-top: 2px; }
    .task-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .task-actions button { background: transparent; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: 0.15s; font-size: 0.9rem; }
    .task-actions button:hover { background: #f3f4f6; }
    .task-actions .btn-done:hover { background: #d1fae5; color: var(--success); }
    .task-actions .btn-delete:hover { background: #fee2e2; color: var(--danger); }
    .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .category-badge { background: var(--primary-soft); color: var(--primary); padding: 4px 12px; border-radius: 100px; font-weight: 600; font-size: 0.7rem; letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 6px; }
    .due-range { display: flex; align-items: center; gap: 4px; background: #f9fafb; padding: 4px 12px; border-radius: 100px; font-weight: 500; color: var(--text-muted); font-size: 0.75rem; white-space: nowrap; }
    .due-range.overdue { background: #fef2f2; color: var(--danger); font-weight: 600; }
    .due-range.urgent { background: #fffbeb; color: #b45309; font-weight: 600; }
    .due-range i { font-size: 0.7rem; }
    .assignee-badge { display: inline-flex; align-items: center; gap: 6px; background: #f3f4f6; padding: 4px 10px; border-radius: 100px; font-weight: 500; font-size: 0.75rem; color: var(--text); }
    .assignee-badge i { color: var(--primary); font-size: 0.7rem; }
    .task-card.completed { opacity: 0.7; border-left-color: var(--success); background: #fafdfb; }
    .task-card.completed .task-title { text-decoration: line-through; color: var(--text-muted); }
    .task-card.completed .category-badge { background: #e5e7eb; color: #6b7280; }
    .task-card.completed .assignee-badge { background: #e5e7eb; color: #6b7280; }
    .empty-state { grid-column: 1 / -1; background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius-lg); padding: 60px 20px; text-align: center; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .empty-state i { font-size: 3rem; color: #d1d5db; margin-bottom: 8px; }
    .empty-state p { font-size: 1.1rem; font-weight: 500; }
    .empty-state small { font-size: 0.9rem; }
    @media (max-width: 760px) {
      body { padding: 16px 12px 32px; }
      .header { flex-direction: column; align-items: stretch; }
      .user-area { justify-content: space-between; }
      .user-switcher { flex: 1; }
      .add-form { flex-direction: column; }
      .time-range-group { flex-direction: column; gap: 8px; }
      .btn-add { width: 100%; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-tabs { justify-content: center; }
      .member-filter { justify-content: center; }
      .board { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <header class="header">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-calendar-check"></i></div>
      <div class="logo-text"><h1>多人日程</h1><p>时间段显示 · 动态成员</p></div>
    </div>
    <div class="user-area">
      <div class="user-switcher">
        <label for="currentUserSelect"><i class="fas fa-user-circle"></i> 当前</label>
        <select id="currentUserSelect"></select>
      </div>
      <button class="btn-add-member" id="addMemberBtn"><i class="fas fa-user-plus"></i> 添加成员</button>
    </div>
    <div class="stats-badge">
      <div><i class="fas fa-list-check"></i> 总计 <span id="totalCount">0</span></div>
      <div><i class="fas fa-circle-check" style="color: var(--success);"></i> 完成 <span id="doneCount">0</span></div>
    </div>
  </header>

  <div class="add-card">
    <form class="add-form" id="addForm">
      <div class="form-group" style="flex: 2 1 180px;">
        <label for="taskInput"><i class="fas fa-pen"></i> 任务描述</label>
        <input type="text" id="taskInput" placeholder="例如：完成项目报告、阅读30分钟……" autocomplete="off" required>
      </div>
      <div class="form-group" style="flex: 0 1 120px;">
        <label for="categorySelect"><i class="fas fa-tag"></i> 分类</label>
        <select id="categorySelect">
          <option value="工作">💼 工作</option>
          <option value="学习">📚 学习</option>
          <option value="生活">🏠 生活</option>
          <option value="重要">⭐ 重要</option>
        </select>
      </div>
      <div class="form-group" style="flex: 0 1 140px;">
        <label for="dueDateInput"><i class="fas fa-calendar-day"></i> 截止日期</label>
        <input type="date" id="dueDateInput">
      </div>
      <div class="time-range-group">
        <div class="form-group"><label for="startTimeInput"><i class="fas fa-hourglass-start"></i> 开始</label><input type="time" id="startTimeInput" step="60"></div>
        <div class="form-group"><label for="endTimeInput"><i class="fas fa-hourglass-end"></i> 结束</label><input type="time" id="endTimeInput" step="60"></div>
      </div>
      <div class="form-group" style="flex: 0 1 120px;">
        <label for="assigneeSelect"><i class="fas fa-user-tag"></i> 负责人</label>
        <select id="assigneeSelect"></select>
      </div>
      <button type="submit" class="btn-add" id="addBtn"><i class="fas fa-plus-circle"></i> 添加</button>
    </form>
  </div>

  <div class="filter-bar">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-btn active" data-filter="all"><i class="fas fa-layer-group"></i> 全部</button>
      <button class="filter-btn" data-filter="工作"><i class="fas fa-briefcase"></i> 工作</button>
      <button class="filter-btn" data-filter="学习"><i class="fas fa-book"></i> 学习</button>
      <button class="filter-btn" data-filter="生活"><i class="fas fa-home"></i> 生活</button>
      <button class="filter-btn" data-filter="重要"><i class="fas fa-star"></i> 重要</button>
    </div>
    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
      <div class="member-filter">
        <i class="fas fa-users"></i>
        <select id="memberFilterSelect"><option value="all">全部成员</option></select>
      </div>
      <button class="btn-clear" id="clearCompletedBtn"><i class="fas fa-broom"></i> 清除已完成</button>
    </div>
  </div>

  <div class="board" id="taskBoard"></div>
</div>

<script>
  // ============================================================
  // 配置：成员列表（以这里为准，修改后刷新即可）
  // ============================================================
  const STORAGE_KEY = 'multi_user_schedule_v3';
  let MEMBERS = ['张政楠', '杨璐', '朱淑童', '薛凯敏', '倪碧瑜', '黄晓红', '陈珍妮', '王晓倩', '傅儒豪'];
  let currentUser = MEMBERS[0];

  // 演示数据（负责人尽量用新名单，若旧数据不在名单会自动归到第一个成员）
  const DEMO_TASKS = [
    { id: '1', title: '完成季度汇报PPT', category: '工作', dueDate: '2025-04-10', startTime: '14:00', endTime: '18:00', completed: false, assignee: '张政楠' },
    { id: '2', title: '阅读《原子习惯》第4章', category: '学习', dueDate: '2025-04-08', startTime: '20:00', endTime: '21:30', completed: false, assignee: '杨璐' },
    { id: '3', title: '去超市采购日用品', category: '生活', dueDate: '2025-04-07', startTime: '17:30', endTime: '19:00', completed: false, assignee: '朱淑童' },
    { id: '4', title: '预约牙医', category: '重要', dueDate: '2025-04-12', startTime: '10:00', endTime: '10:45', completed: true, assignee: '薛凯敏' },
    { id: '5', title: '团队周会', category: '工作', dueDate: '2025-04-09', startTime: '14:00', endTime: '15:30', completed: false, assignee: '倪碧瑜' },
    { id: '6', title: '健身30分钟', category: '生活', dueDate: '2025-04-06', startTime: '07:00', endTime: '07:30', completed: true, assignee: '黄晓红' },
    { id: '7', title: '整理项目文档', category: '工作', dueDate: '2025-04-11', startTime: '16:00', endTime: '17:00', completed: false, assignee: '陈珍妮' },
    { id: '8', title: '学习React基础', category: '学习', dueDate: '2025-04-15', startTime: '19:30', endTime: '21:00', completed: false, assignee: '王晓倩' },
  ];

  let tasks = [];
  let currentCategoryFilter = 'all';
  let currentMemberFilter = 'all';

  // ============================================================
  // 工具
  // ============================================================
  const generateId = () => Date.now() + '-' + Math.random().toString(36).substr(2, 9);

  function saveTasks() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
  function saveMembers() { localStorage.setItem(STORAGE_KEY + '_members', JSON.stringify(MEMBERS)); }

  // 关键修改：加载任务时，强制将 assignee 修正为 MEMBERS 内的名字；不覆盖 MEMBERS 本身
  function loadTasks() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        tasks = parsed.filter(t => t && typeof t === 'object').map(t => ({
          id: t.id || generateId(),
          title: t.title || '未命名任务',
          category: t.category || '生活',
          dueDate: t.dueDate || '',
          startTime: t.startTime || '',
          endTime: t.endTime || '',
          completed: !!t.completed,
          assignee: MEMBERS.includes(t.assignee) ? t.assignee : MEMBERS[0]
        }));
      } catch (e) {
        tasks = [...DEMO_TASKS];
      }
    } else {
      tasks = [...DEMO_TASKS];
    }
    saveTasks();
    sortTasks();
  }

  function sortTasks() {
    tasks.sort((a, b) => {
      if (a.completed !== b.completed) return a.completed ? 1 : -1;
      const aDT = a.dueDate ? `${a.dueDate} ${a.startTime || '23:59'}` : '';
      const bDT = b.dueDate ? `${b.dueDate} ${b.startTime || '23:59'}` : '';
      if (aDT && bDT) return aDT.localeCompare(bDT);
      if (aDT) return -1;
      if (bDT) return 1;
      return 0;
    });
  }

  function getFilteredTasks() {
    let filtered = tasks;
    if (currentCategoryFilter !== 'all') filtered = filtered.filter(t => t.category === currentCategoryFilter);
    if (currentMemberFilter !== 'all') filtered = filtered.filter(t => t.assignee === currentMemberFilter);
    return [...filtered].sort((a, b) => {
      if (a.completed !== b.completed) return a.completed ? 1 : -1;
      const aDT = a.dueDate ? `${a.dueDate} ${a.startTime || '23:59'}` : '';
      const bDT = b.dueDate ? `${b.dueDate} ${b.startTime || '23:59'}` : '';
      if (aDT && bDT) return aDT.localeCompare(bDT);
      if (aDT) return -1;
      if (bDT) return 1;
      return 0;
    });
  }

  function getDeadlineStatus(task) {
    if (task.completed) return { status: 'completed' };
    if (!task.dueDate) return { status: 'none' };
    const endTime = task.endTime || task.startTime || '23:59';
    const dueStr = `${task.dueDate}T${endTime}:59`;
    const due = new Date(dueStr);
    const now = new Date();
    if (due < now) return { status: 'overdue' };
    if ((due - now) / (1000 * 60 * 60) <= 2) return { status: 'urgent' };
    return { status: 'normal' };
  }

  function formatTime(timeStr) {
    if (!timeStr) return '';
    const [h, m] = timeStr.split(':');
    const hour = parseInt(h, 10);
    const minute = parseInt(m, 10);
    if (minute === 0) return `${hour}点`;
    return `${hour}点${minute}分`;
  }

  function formatTimeRange(task) {
    if (!task.dueDate) return '无日期';
    let timeStr = '';
    if (task.startTime && task.endTime) timeStr = `${formatTime(task.startTime)} - ${formatTime(task.endTime)}`;
    else if (task.startTime) timeStr = formatTime(task.startTime);
    else if (task.endTime) timeStr = formatTime(task.endTime);
    else timeStr = '全天';
    return `${task.dueDate} ${timeStr}`;
  }

  function updateStats() {
    const filtered = getFilteredTasks();
    document.getElementById('totalCount').textContent = filtered.length;
    document.getElementById('doneCount').textContent = filtered.filter(t => t.completed).length;
  }

  // ============================================================
  // 渲染
  // ============================================================
  const board = document.getElementById('taskBoard');

  function renderBoard() {
    const filteredTasks = getFilteredTasks();
    if (filteredTasks.length === 0) {
      board.innerHTML = `<div class="empty-state"><i class="fas fa-clipboard-list"></i><p>没有符合条件的日程</p><small>尝试调整筛选或添加新任务 ✨</small></div>`;
      updateStats();
      return;
    }
    let html = '';
    filteredTasks.forEach(task => {
      const statusInfo = getDeadlineStatus(task);
      let dueRangeHtml = '';
      if (task.dueDate) {
        const rangeStr = formatTimeRange(task);
        let dueClass = 'due-range';
        let extraIcon = '';
        if (statusInfo.status === 'overdue') { dueClass += ' overdue'; extraIcon = ' ⏰ 逾期'; }
        else if (statusInfo.status === 'urgent') { dueClass += ' urgent'; extraIcon = ' ⚠️ 紧急'; }
        dueRangeHtml = `<span class="${dueClass}"><i class="far fa-clock"></i> ${rangeStr}${extraIcon}</span>`;
      } else {
        dueRangeHtml = `<span class="due-range"><i class="far fa-calendar"></i> 无日期</span>`;
      }
      const catIcon = { '工作': 'fa-briefcase', '学习': 'fa-book', '生活': 'fa-home', '重要': 'fa-star' }[task.category] || 'fa-tag';
      const completedClass = task.completed ? 'completed' : '';
      html += `
        <div class="task-card ${completedClass}" data-id="${task.id}" data-category="${task.category}">
          <div class="task-header">
            <div class="task-title">
              <i class="fas ${task.completed ? 'fa-circle-check' : 'fa-circle'}" style="color: ${task.completed ? 'var(--success)' : 'var(--text-muted)'}"></i>
              ${escapeHtml(task.title)}
            </div>
            <div class="task-actions">
              <button class="btn-done" title="${task.completed ? '标记为未完成' : '标记为已完成'}" onclick="toggleTaskStatus('${task.id}')"><i class="fas ${task.completed ? 'fa-rotate-left' : 'fa-check'}"></i></button>
              <button class="btn-delete" title="删除任务" onclick="deleteTask('${task.id}')"><i class="fas fa-trash-can"></i></button>
            </div>
          </div>
          <div class="task-meta">
            <span class="category-badge"><i class="fas ${catIcon}"></i> ${task.category}</span>
            ${dueRangeHtml}
            <span class="assignee-badge"><i class="fas fa-user"></i> ${escapeHtml(task.assignee)}</span>
          </div>
        </div>
      `;
    });
    board.innerHTML = html;
    updateStats();
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  window.toggleTaskStatus = function(id) {
    const task = tasks.find(t => t.id === id);
    if (task) { task.completed = !task.completed; sortTasks(); saveTasks(); renderBoard(); updateStats(); }
  };
  window.deleteTask = function(id) {
    if (confirm('确定删除这条日程吗？')) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks(); renderBoard(); updateStats();
    }
  };

  // ============================================================
  // 下拉框
  // ============================================================
  function populateMemberSelects() {
    if (!MEMBERS.includes(currentUser)) currentUser = MEMBERS[0];
    document.getElementById('currentUserSelect').innerHTML = MEMBERS.map(m => `<option value="${m}" ${m === currentUser ? 'selected' : ''}>${m}</option>`).join('');
    document.getElementById('assigneeSelect').innerHTML = MEMBERS.map(m => `<option value="${m}" ${m === currentUser ? 'selected' : ''}>${m}</option>`).join('');
    if (currentMemberFilter !== 'all' && !MEMBERS.includes(currentMemberFilter)) currentMemberFilter = 'all';
    document.getElementById('memberFilterSelect').innerHTML = `<option value="all">全部成员</option>` + MEMBERS.map(m => `<option value="${m}" ${m === currentMemberFilter ? 'selected' : ''}>${m}</option>`).join('');
  }

  function syncAssigneeWithCurrentUser() {
    const sel = document.getElementById('assigneeSelect');
    if (sel) sel.value = currentUser;
  }

  // ============================================================
  // 添加成员（临时保存，刷新后仍以代码 MEMBERS 为准）
  // ============================================================
  document.getElementById('addMemberBtn').addEventListener('click', () => {
    const name = prompt('请输入新成员姓名：');
    if (!name) return;
    const trimmed = name.trim();
    if (!trimmed) return alert('姓名不能为空');
    if (MEMBERS.includes(trimmed)) return alert(`成员 "${trimmed}" 已存在`);
    MEMBERS.push(trimmed);
    saveMembers();
    populateMemberSelects();
    syncAssigneeWithCurrentUser();
    renderBoard();
    updateStats();
    alert(`已添加成员：${trimmed}`);
  });

  // ============================================================
  // 表单与筛选
  // ============================================================
  const addForm = document.getElementById('addForm');
  const taskInput = document.getElementById('taskInput');
  const categorySelect = document.getElementById('categorySelect');
  const dueDateInput = document.getElementById('dueDateInput');
  const startTimeInput = document.getElementById('startTimeInput');
  const endTimeInput = document.getElementById('endTimeInput');
  const assigneeSelect = document.getElementById('assigneeSelect');

  addForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = taskInput.value.trim();
    if (!title) return alert('请输入任务描述');
    let startTime = startTimeInput.value;
    let endTime = endTimeInput.value;
    if (startTime && endTime && startTime >= endTime) return alert('结束时间必须晚于开始时间');

    const newTask = {
      id: generateId(),
      title,
      category: categorySelect.value,
      dueDate: dueDateInput.value || '',
      startTime,
      endTime,
      completed: false,
      assignee: assigneeSelect.value
    };
    tasks.push(newTask);
    sortTasks(); saveTasks();
    taskInput.value = '';
    if (currentCategoryFilter !== 'all' && currentCategoryFilter !== newTask.category) {
      currentCategoryFilter = 'all';
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === 'all'));
    }
    if (currentMemberFilter !== 'all' && currentMemberFilter !== newTask.assignee) {
      currentMemberFilter = 'all';
      document.getElementById('memberFilterSelect').value = 'all';
    }
    renderBoard(); updateStats(); taskInput.focus();
  });

  document.getElementById('filterTabs').addEventListener('click', (e) => {
    const target = e.target.closest('.filter-btn');
    if (!target) return;
    currentCategoryFilter = target.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === currentCategoryFilter));
    renderBoard(); updateStats();
  });

  document.getElementById('memberFilterSelect').addEventListener('change', (e) => {
    currentMemberFilter = e.target.value;
    renderBoard(); updateStats();
  });

  document.getElementById('clearCompletedBtn').addEventListener('click', () => {
    const filtered = getFilteredTasks();
    const completedFiltered = filtered.filter(t => t.completed);
    if (completedFiltered.length === 0) return alert('没有已完成的日程可清除');
    if (confirm(`确定删除当前筛选下 ${completedFiltered.length} 条已完成日程吗？`)) {
      const ids = new Set(completedFiltered.map(t => t.id));
      tasks = tasks.filter(t => !ids.has(t.id));
      saveTasks(); renderBoard(); updateStats();
    }
  });

  document.getElementById('currentUserSelect').addEventListener('change', (e) => {
    currentUser = e.target.value;
    syncAssigneeWithCurrentUser();
  });

  // ============================================================
  // 初始化
  // ============================================================
  function init() {
    // 关键：不调用 loadMembers()，直接使用代码中定义的 MEMBERS
    loadTasks();
    populateMemberSelects();

    const now = new Date();
    dueDateInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    const start = new Date(now.getTime() + 60 * 60 * 1000);
    start.setMinutes(0, 0, 0);
    const end = new Date(start.getTime() + 60 * 60 * 1000);
    const fmt = (d) => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    startTimeInput.value = fmt(start);
    endTimeInput.value = fmt(end);

    syncAssigneeWithCurrentUser();
    renderBoard();
    updateStats();
  }

  init();

  window.addEventListener('beforeunload', () => {
    saveTasks();
    saveMembers();
  });
</script>
</body>
</html>
